# Держит стейдж-проект Supabase проснувшимся.
#
# Бесплатный план усыпляет проект после недели без запросов, а усыплённый проект перестаёт
# разрешаться в DNS — и шаг Build в ci.yml краснеет на всех ветках сразу, потому что хост, которого
# нет, это не пустой ответ, а брошенный fetch. Именно так и случилось 21 сентября 2026: два PR
# покраснели на ровном месте, и полчаса ушло на поиск ошибки, которой в коде не было.
#
# Раз в три дня, с запасом к недельному порогу. Запрос ровно один и читает одну строку.
#
# Падает громко и намеренно: если стейдж недоступен, лучше узнать из этой джобы, чем из красного
# билда на чужом PR. Учти, что GitHub отключает расписания в репозитории без активности 60 дней —
# для этого проекта не проблема, но если workflow вдруг перестанет запускаться, причина эта.

name: Ping staging

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query staging
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Стейдж ответил $code — вероятно, усыплён или ещё восстанавливается."
            exit 1
          fi
