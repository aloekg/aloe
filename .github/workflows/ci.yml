name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Turbopack's persistent cache, so a PR's build reuses the previous run's work. Keyed on the
      # lockfile and every source file, with a fallback to the last build against the same lockfile.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test

      # Build last: it is the slowest step and the checks above localise failures better.
      # Supabase env vars are needed because generateStaticParams and the sitemap query the
      # database at build time.
      #
      # These secrets hold the STAGING project's anon key, not production's, so nothing in this
      # repository reaches the live database. Both call sites are read-only.
      #
      # An earlier version of this comment warned only about the quiet failure: a staging project
      # paused for inactivity keeps this step green while prerendering zero products. The loud one
      # turned out to be the real hazard — on 2026-09-21 staging was paused, its host stopped
      # resolving, and every branch went red at once, because a host that is not there is not an
      # empty query, it is a thrown fetch. The secrets pointed at production for two hours that day
      # as a stop-gap; .github/workflows/ping-staging.yml is the actual fix, keeping the project
      # awake so neither failure has the chance to happen.

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Not required to build — it just makes the prerendered robots.txt match what staging
          # actually serves, instead of baking the canonical one into a throwaway artefact.
          DEPLOY_ORIGIN: https://stage.aloe.kg
