name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test

      # Build last: it is the slowest step and the checks above localise failures better.
      # Supabase env vars are needed because generateStaticParams and the sitemap query the
      # database at build time.
      #
      # These secrets held the STAGING project's anon key until 2026-09-21, when that project was
      # deleted — and every build on every branch went red, because a host that no longer resolves
      # is not an empty query, it is a thrown fetch. They now hold PRODUCTION's publishable key,
      # which the earlier version of this comment argued against. What it was protecting against
      # was the opposite failure: a staging project paused for inactivity keeps this step green
      # while prerendering zero products. Pointing at a project that is always up removes that,
      # and costs little — both call sites are read-only, the key is the one every browser already
      # carries, and RLS hands the build nothing but published rows.
      #
      # The price, worth naming: CI now depends on the live database, so an outage there reds the
      # build. Point these back at staging the day a staging project exists again.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Not required to build. It keeps this throwaway artefact's robots.txt on the noindex
          # side of the DEPLOY_ORIGIN guard (lib/deploy-origin.ts) rather than baking the
          # canonical one into it — which matters more now that the build reads production.
          DEPLOY_ORIGIN: https://stage.aloe.kg
