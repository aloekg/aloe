name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm test

      # Build last: it is the slowest step and the checks above localise failures better.
      # Supabase env vars are needed because generateStaticParams and the sitemap query the
      # database at build time.
      #
      # These secrets hold the STAGING project's anon key, not production's, so nothing in this
      # repository can reach the live database. Both call sites are read-only and both swallow a
      # failed query as an empty list — which is the catch: if the staging project is ever paused
      # for inactivity, this step stays green while prerendering zero products. A red build would
      # be friendlier. Visit staging, or add a scheduled ping, rather than repointing this at
      # production.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Not required to build — it just makes the prerendered robots.txt match what staging
          # actually serves, instead of baking the canonical one into a throwaway artefact.
          DEPLOY_ORIGIN: https://stage.aloe.kg
